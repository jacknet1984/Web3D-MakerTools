<title>Keychain Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Roboto+Slab:wght@700&family=Poppins:wght@700&family=Lobster&family=Permanent+Marker&family=Caveat:wght@700&family=Fredoka:wght@600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: comandi a sinistra, anteprima a destra (sopra su telefono) */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --ink:#1f2328; --muted:#626a73; --line:#dcd8d2; --stage:#e7e3dd;
  --accent:#e8590c; --accent-ink:#ffffff; --field:#f7f5f2; --warn:#a15c00; --ok:#2d6a3e;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --panel:#1b1e23; --ink:#ecebe8; --muted:#9aa1a9; --line:#2d3239; --stage:#0d0f12; --field:#23272d; --warn:#e0a04a; --ok:#6cc08a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e23; --ink:#ecebe8; --muted:#9aa1a9; --line:#2d3239; --stage:#0d0f12; --field:#23272d; --warn:#e0a04a; --ok:#6cc08a; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:600 12px var(--font);background:var(--panel);color:var(--ink);border:0;padding:7px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:500 14px var(--font);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:781px){.stagecard{position:sticky;top:12px}}
@media (max-width:780px){.grid{grid-template-columns:1fr}.stagecard{order:-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
label output{color:var(--ink);font-weight:600;margin-left:6px}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
input[type=text],select{font:15px var(--font);background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:500 13px var(--font);background:var(--field);color:var(--ink);border:0;padding:9px 6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:3px;cursor:pointer}
.stage{background:var(--stage);border-radius:14px;border:1px solid var(--line);position:relative;height:min(62vh,460px);min-height:280px;overflow:hidden}
.stage canvas[hidden]{display:none}
#litCv{object-fit:contain}
.stage canvas,.stage svg{width:100%;height:100%;display:block}
.stage .badge{position:absolute;left:10px;top:10px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:999px;padding:3px 9px;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 12.5px var(--font);border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 11px;color:var(--muted)}
.chip b{color:var(--ink)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 14.5px var(--font);background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;flex:1 1 200px}
.btn.alt{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.mini{flex:0 0 auto;font-size:13px;padding:8px 12px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin:0}
#status{font-size:13px;color:var(--muted);min-height:20px}
#status.err{color:var(--warn)} #status.ok{color:var(--ok)}
.sec{display:none;flex-direction:column;gap:12px}.sec.on{display:flex}
.hrow{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;font-size:13px;color:var(--ink)}
.hrow small{display:block;color:var(--muted);font-size:12px}
button.sw{width:42px;height:34px;border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:0}
.hrow.hv{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:10px}
.hrow.hl{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.hrow{position:relative}
.rm{position:absolute;right:2px;top:2px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px}
#selPanel[hidden]{display:none}
#selPanel{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.selt{color:var(--muted)}
.selrow{display:flex;gap:6px;flex-wrap:wrap}
button.sw.sm{width:34px;height:30px;font:700 12px var(--font)}
button.sw.cur{outline:2px solid var(--accent);outline-offset:1px}
button.sw.plus{background:var(--field);color:var(--ink);font-size:16px}
.pal{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pal[hidden]{display:none}
.pal button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:0}
#hueList{display:flex;flex-direction:column;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Keychain Maker</h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="lang" id="lang"><button data-l="en" aria-pressed="true">EN</button><button data-l="it" aria-pressed="false">IT</button></div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabText" aria-selected="true" data-i="tabText"></button>
    <button role="tab" id="tabImg" aria-selected="false" data-i="tabImg"></button>
    <button role="tab" id="tabHue" aria-selected="false" data-i="tabHue"></button>
    <button role="tab" id="tabLit" aria-selected="false" data-i="tabLit"></button>
    <button role="tab" id="tabSvg" aria-selected="false" data-i="tabSvg"></button>
  </div>

  <div class="grid">
    <div class="card" id="controls">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 id="ctlTitle"></h2><button class="btn alt mini" id="bReset" data-i="reset"></button></div>

      <div class="sec on" id="secText">
        <label for="txt"><span data-i="text"></span><input id="txt" type="text" value="MARCO" maxlength="24"></label>
        <label for="font"><span data-i="font"></span>
          <select id="font">
            <option value="Bebas Neue|400">Bebas Neue</option>
            <option value="Pacifico|400">Pacifico</option>
            <option value="Roboto Slab|700">Roboto Slab</option>
            <option value="Poppins|700">Poppins Bold</option>
            <option value="DM Sans|700">DM Sans Bold</option>
            <option value="Lobster|400">Lobster</option>
            <option value="Permanent Marker|400">Permanent Marker</option>
            <option value="Caveat|700">Caveat</option>
            <option value="Fredoka|600">Fredoka</option>
          </select>
        </label>
        <div class="btns"><button class="btn alt mini" id="bFont" data-i="ownFont"></button><input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" hidden></div>
        <label for="size"><span data-i="fontSize"></span><output id="oSize"></output><input id="size" type="range" min="8" max="40" value="16"></label>
        <label for="pad"><span data-i="padding"></span><output id="oPad"></output><input id="pad" type="range" min="2" max="12" step="0.5" value="5"></label>
        <div><div class="hint" style="margin-bottom:5px" data-i="shape"></div>
          <div class="seg" id="shape"><button aria-pressed="true" data-v="round" data-i="sRound"></button><button aria-pressed="false" data-v="oval" data-i="sOval"></button><button aria-pressed="false" data-v="hex" data-i="sHex"></button></div></div>
      </div>

      <div class="sec" id="secImg">
        <div class="btns"><button class="btn alt mini" id="bImg" data-i="loadImg"></button><input type="file" id="fImg" accept="image/*,.svg" hidden></div>
        <p class="hint" id="imgName"></p>
        <label class="chk"><input type="checkbox" id="cBg"><span data-i="rmBg"></span></label>
        <div id="bgBox" hidden>
          <label for="rBg"><span data-i="bgTol"></span><output id="oBg">40</output><input id="rBg" type="range" min="5" max="150" value="40"></label>
          <label class="chk"><input type="checkbox" id="cBgIn"><span data-i="bgInner"></span></label>
        </div>
        <p class="hint" id="bgNote" hidden data-i="bgAuto"></p>
        <label for="wmm"><span data-i="width"></span><output id="oW"></output><input id="wmm" type="range" min="20" max="200" value="45"></label>
        <label for="margin"><span data-i="margin"></span><output id="oM"></output><input id="margin" type="range" min="0" max="12" step="0.5" value="3"></label>
      </div>

      <div class="sec" id="secDetail">
        <label for="thr"><span id="lThr"></span><output id="oThr"></output><input id="thr" type="range" min="0" max="100" value="50"></label>
        <p class="hint" id="hThr"></p>
        <div id="boxSvgOpt">
          <label for="svgEng"><span data-i="engMode"></span>
            <select id="svgEng"><option value="bitmap" data-i="engBitmap"></option><option value="fill" data-i="engFill"></option><option value="lines" data-i="engLines"></option></select></label>
          <p class="hint" id="hEng"></p>
        </div>
      </div>

      <div class="sec" id="secLit">
        <div><div class="hint" style="margin-bottom:5px" data-i="litShapeL"></div>
          <div class="seg" id="litShape"><button aria-pressed="true" data-v="cut" data-i="litCut"></button><button aria-pressed="false" data-v="rect" data-i="litRect"></button></div></div>
        <div class="row2">
          <label for="tmin"><span data-i="tmin"></span><output id="oTmin"></output><input id="tmin" type="range" min="0.4" max="2" step="0.1" value="0.8"></label>
          <label for="tmax"><span data-i="tmax"></span><output id="oTmax"></output><input id="tmax" type="range" min="1.5" max="5" step="0.1" value="3.2"></label>
        </div>
        <label for="litFrame"><span data-i="litFrame"></span><output id="oLF"></output><input id="litFrame" type="range" min="0" max="10" step="0.5" value="3"></label>
        <label for="litGamma"><span data-i="litGamma"></span><output id="oLG"></output><input id="litGamma" type="range" min="0.5" max="2" step="0.1" value="1"></label>
        <label class="chk"><input type="checkbox" id="litInv"><span data-i="litInv"></span></label>
        <label for="litPitch"><span data-i="litPitch"></span>
          <select id="litPitch"><option value="0.4" data-i="pFast"></option><option value="0.3" data-i="pNorm" selected></option><option value="0.2" data-i="pHigh"></option></select></label>
        <div><div class="hint" style="margin-bottom:5px" data-i="litViewL"></div>
          <div class="seg" id="litView"><button aria-pressed="true" data-v="back" data-i="viewBack"></button><button aria-pressed="false" data-v="3d" data-i="view3d"></button></div></div>
        <p class="hint" data-i="litHint"></p>
      </div>

      <div class="sec" id="secHue">
        <label for="hueN"><span data-i="hueN"></span><output id="oHN"></output><input id="hueN" type="range" min="2" max="8" value="5"></label>
        <label for="lh"><span data-i="lh"></span>
          <select id="lh"><option value="0.08">0.08 mm</option><option value="0.12">0.12 mm</option><option value="0.16">0.16 mm</option><option value="0.2" selected>0.20 mm</option><option value="0.24">0.24 mm</option><option value="0.28">0.28 mm</option></select></label>
        <div class="row2">
          <label for="baseL"><span data-i="baseL"></span><output id="oBL"></output><input id="baseL" type="range" min="2" max="20" value="5"></label>
          <label for="stepL"><span data-i="stepL"></span><output id="oSL"></output><input id="stepL" type="range" min="1" max="6" value="2"></label>
        </div>
        <label class="chk"><input type="checkbox" id="hueRev"><span data-i="hueRev"></span></label>
        <div class="btns"><button class="btn alt mini" id="bHueReset" data-i="resetColours"></button><button class="btn alt mini" id="bHueUndo" data-i="undoArea"></button></div>
        <div id="hueList"></div>
        <p class="hint" data-i="hueHint"></p>
      </div>

      <div class="sec on" id="secCommon">
        <div><div class="hint" style="margin-bottom:5px" data-i="holeLabel"></div>
          <div class="seg" id="hole"><button aria-pressed="true" data-v="left" data-i="hLeft"></button><button aria-pressed="false" data-v="top" data-i="hTop"></button><button aria-pressed="false" data-v="none" data-i="hNone"></button></div></div>
        <div id="boxHoleD"><label for="holeD"><span data-i="holeD"></span><output id="oHD"></output><input id="holeD" type="range" min="3" max="8" step="0.5" value="4.5"></label></div>
        <div id="box3d" style="display:flex;flex-direction:column;gap:12px">
          <label for="rimW"><span data-i="rimW"></span><output id="oRW"></output><input id="rimW" type="range" min="0" max="4" step="0.2" value="1.2"></label>
          <div class="row2">
            <label for="tBase"><span data-i="tBase"></span><output id="oTB"></output><input id="tBase" type="range" min="1" max="5" step="0.2" value="2.4"></label>
            <label for="hArt"><span data-i="hArt"></span><output id="oHA"></output><input id="hArt" type="range" min="0.4" max="3" step="0.2" value="1"></label>
          </div>
          <label for="hRim"><span data-i="hRim"></span><output id="oHR"></output><input id="hRim" type="range" min="0.4" max="3" step="0.2" value="1.4"></label>
          <div class="colors">
            <label><span data-i="cBase"></span><input type="color" id="c1" value="#2f6fda"></label>
            <label><span data-i="cArt"></span><input type="color" id="c2" value="#fff3d6"></label>
            <label><span data-i="cRim"></span><input type="color" id="c3" value="#f2b705"></label>
          </div>
        </div>
      </div>
    </div>

    <div class="card stagecard">
      <h2 data-i="preview"></h2>
      <div class="stage" id="stage"><canvas id="litCv" hidden></canvas><span class="badge" id="badge"></span></div>
      <div id="selPanel" hidden></div>
      <div class="chips" id="chips"></div>
      <div id="status"></div>
      <div class="btns">
        <button class="btn" id="bExp" data-i="export3d"></button>
        <button class="btn alt" id="bSvg" data-i="exportSvg"></button>
        <button class="btn alt" id="bPng" data-i="exportPng"></button>
      </div>
      <div class="btns" id="rowZip" style="justify-content:center"><button class="btn" id="bZip" style="flex:0 1 320px" data-i="exportSvgZip"></button></div>
      <p class="hint" id="expHint"></p>
    </div>
  </div>
</div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=(a)=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
  function stlBinary(V, I, off) {
    const nt = I.length / 3; const buf = new ArrayBuffer(84 + nt * 50); const dv = new DataView(buf);
    new Uint8Array(buf).set(new TextEncoder().encode('Keychain Maker'), 0);
    dv.setUint32(80, nt, true);
    for (let t = 0; t < nt; t++) {
      const o = 84 + t * 50;
      const a = I[3 * t] * 3, b = I[3 * t + 1] * 3, c = I[3 * t + 2] * 3;
      const A = [V[a] + off[0], V[a + 1] + off[1], V[a + 2] + off[2]], B = [V[b] + off[0], V[b + 1] + off[1], V[b + 2] + off[2]], C = [V[c] + off[0], V[c + 1] + off[1], V[c + 2] + off[2]];
      const n = norm(cross([B[0] - A[0], B[1] - A[1], B[2] - A[2]], [C[0] - A[0], C[1] - A[1], C[2] - A[2]]));
      dv.setFloat32(o, n[0], true); dv.setFloat32(o + 4, n[1], true); dv.setFloat32(o + 8, n[2], true);
      [A, B, C].forEach((p, k) => { dv.setFloat32(o + 12 + k * 12, p[0], true); dv.setFloat32(o + 16 + k * 12, p[1], true); dv.setFloat32(o + 20 + k * 12, p[2], true); });
    }
    return new Uint8Array(buf);
  }

  function model3MF(parts, off) {
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const X = [], Tr = []; let vbase = 0; const ranges = []; let tbase = 0;
    parts.forEach((p, k) => {
      for (let i = 0; i < p.V.length; i += 3) X.push('<vertex x="' + (p.V[i] + off[0]).toFixed(4) + '" y="' + (p.V[i + 1] + off[1]).toFixed(4) + '" z="' + (p.V[i + 2] + off[2]).toFixed(4) + '"/>');
      for (let i = 0; i < p.I.length; i += 3) Tr.push('<triangle v1="' + (p.I[i] + vbase) + '" v2="' + (p.I[i + 1] + vbase) + '" v3="' + (p.I[i + 2] + vbase) + '" pid="2" p1="' + k + '"/>');
      ranges.push([tbase, tbase + p.I.length / 3 - 1]);
      vbase += p.V.length / 3; tbase += p.I.length / 3;
    });
    const mats = parts.map((p) => '<base name="' + esc(p.name) + '" displaycolor="' + p.color.toUpperCase() + 'FF"/>').join('');
    const modelXml = '<?xml version="1.0" encoding="UTF-8"?>\n<model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">\n<metadata name="Application">Keychain Maker</metadata>\n<resources>\n<basematerials id="2">' + mats + '</basematerials>\n<object id="1" type="model" pid="2" pindex="0"><mesh>\n<vertices>\n' + X.join('\n') + '\n</vertices>\n<triangles>\n' + Tr.join('\n') + '\n</triangles>\n</mesh></object>\n</resources>\n<build><item objectid="1"/></build>\n</model>';
    const vols = parts.map((p, k) => '<volume firstid="' + ranges[k][0] + '" lastid="' + ranges[k][1] + '"><metadata type="volume" key="name" value="' + esc(p.name) + '"/><metadata type="volume" key="volume_type" value="ModelPart"/><metadata type="volume" key="extruder" value="' + p.extruder + '"/></volume>').join('\n');
    const cfg = '<?xml version="1.0" encoding="UTF-8"?>\n<config>\n<object id="1" instances_count="1"><metadata type="object" key="name" value="Keychain Maker"/><metadata type="object" key="extruder" value="1"/>\n' + vols + '\n</object>\n</config>';
    const ct = '<?xml version="1.0" encoding="UTF-8"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/><Default Extension="config" ContentType="text/xml"/></Types>';
    const rels = '<?xml version="1.0" encoding="UTF-8"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>';
    const te = new TextEncoder();
    return [
      { name: '[Content_Types].xml', data: te.encode(ct) },
      { name: '_rels/.rels', data: te.encode(rels) },
      { name: '3D/3dmodel.model', data: te.encode(modelXml) },
      { name: 'Metadata/Slic3r_PE_model.config', data: te.encode(cfg) },
    ];
  }

  const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  async function deflateRaw(u8) {
    const cs = new CompressionStream('deflate-raw'); const w = cs.writable.getWriter(); w.write(u8); w.close();
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }
  async function zip(entries, prog) {
    const enc = new TextEncoder(); const chunks = []; const central = []; let off = 0;
    let ei = 0;

  return svg;
}
